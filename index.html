<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUSE FIT 統合顧客カルテシステム</title>
  <style>
    /* 女性スタッフに好まれる上品なラベンダーとニュートラルなグレーを基調としたモダンデザイン */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* スマホ画面でフルサイズ・PCでカード表示にするレスポンシブ対応 */
    .container {
      max-width: 520px;
      margin: 0 auto;
      background: #ffffff;
      padding: 16px;
      box-sizing: border-box;
      min-height: 100vh;
    }
    @media (min-width: 520px) {
      body { padding: 20px; }
      .container {
        min-height: auto;
        border-radius: 16px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.07);
        padding: 24px;
      }
    }

    h2 {
      text-align: center;
      color: #444;
      font-size: 20px;
      margin-top: 6px;
      margin-bottom: 14px;
      font-weight: 700;
    }

    /* 接続ステータスバー */
    .status-bar {
      text-align: center;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .status-online { background-color: #d9ead3; color: #274e13; border: 1px solid #6aa84f; }
    .status-offline { background-color: #fce5cd; color: #783f04; border: 1px solid #e06666; }

    /* タブ切り替え */
    .tab-container {
      display: flex;
      margin-bottom: 18px;
      background: #eceaf2;
      padding: 4px;
      border-radius: 10px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 12px 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      color: #666;
      border-radius: 8px;
      transition: 0.2s;
    }
    .tab.active {
      background: #ffffff;
      color: #705e9e;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .form-page { display: none; }
    .form-page.active { display: block; }

    .section {
      background: #fafbfc;
      border: 1px solid #eef1f5;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 18px;
    }
    .section-title {
      font-weight: bold;
      color: #705e9e;
      margin-bottom: 14px;
      border-bottom: 2px solid #e1dbec;
      padding-bottom: 6px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge-id {
      background: #705e9e;
      color: #fff;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: #555;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 13px;
      margin-bottom: 14px;
      border: 1px solid #ccd2db;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      background-color: #fff;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #8e7cc3;
      outline: none;
      box-shadow: 0 0 0 3px rgba(142, 124, 195, 0.2);
    }
    input[readonly] {
      background-color: #eef1f6;
      color: #555;
      cursor: not-allowed;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* 50音ボタン */
    .row-50on {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 14px;
      background: #f0edf6;
      padding: 10px;
      border-radius: 10px;
    }
    .btn-50on {
      padding: 11px 0;
      width: 100%;
      text-align: center;
      background: white;
      border: 1px solid #dcd6eb;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      color: #555;
      cursor: pointer;
      box-sizing: border-box;
      user-select: none;
    }
    .btn-50on:active, .btn-50on.active {
      background: #8e7cc3;
      color: white;
      border-color: #8e7cc3;
    }

    /* ボタン群 */
    .btn {
      width: 100%;
      padding: 15px;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
      box-sizing: border-box;
    }
    .btn:active { transform: scale(0.99); opacity: 0.9; }
    .btn-primary { background-color: #8e7cc3; }
    .btn-success { background-color: #6aa84f; }
    .btn-warning { background-color: #e69138; }
    .btn-outline {
      background-color: #fff;
      color: #705e9e;
      border: 2px solid #8e7cc3;
    }

    /* 履歴テーブル */
    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 6px;
    }
    .history-table th, .history-table td {
      padding: 8px 6px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }
    .history-table th {
      background: #f0edf6;
      color: #555;
      font-weight: bold;
    }
    .history-empty {
      text-align: center;
      color: #888;
      font-size: 13px;
      padding: 12px;
    }

    /* ローダー＆トースト通知 */
    .loader {
      display: none;
      text-align: center;
      color: #705e9e;
      font-weight: bold;
      margin: 15px 0;
      font-size: 14px;
      background: #f0edf6;
      padding: 15px;
      border-radius: 10px;
      border: 1px dashed #705e9e;
      line-height: 1.6;
    }
    #toastNotification {
      display: none;
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #333;
      color: #fff;
      padding: 13px 22px;
      border-radius: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      z-index: 9999;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      width: 85%;
      max-width: 420px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📱 顧客カルテ管理アプリ</h2>

  <!-- 接続状態表示バー -->
  <div id="connectionStatus" class="status-bar status-offline">🔌 スプレッドシートと接続確認中...</div>
  <div style="text-align:right; margin-top:-10px; margin-bottom:10px;">
    <span onclick="toggleUrlConfig()" style="font-size:12px; color:#705e9e; cursor:pointer; text-decoration:underline;">⚙️ GASデプロイURLの確認・変更</span>
  </div>
  <div id="urlConfigBox" style="display:none; background:#f0edf6; padding:12px; border-radius:8px; margin-bottom:15px; border:1px solid #dcd6eb;">
    <label style="font-size:12px;">現在のGAS WebアプリURL（「新しいデプロイ」でURLが変わった場合はここに貼り付けて保存）</label>
    <input type="text" id="gasUrlInput" style="font-size:12px; padding:8px; margin-bottom:8px;">
    <button class="btn btn-primary" style="padding:10px; font-size:13px; margin-top:0;" onclick="saveGasUrl()">💾 このURLを保存して再接続</button>
  </div>

  <div class="tab-container">
    <div class="tab active" onclick="switchTab('existingPage', this)">🔍 閲覧・データ修正</div>
    <div class="tab" onclick="switchTab('newPage', this)">✨ 新規データ作成</div>
  </div>

  <div id="globalLoader" class="loader">データを通信中...</div>

  <!-- =========================================================
       【1】既存顧客の閲覧・修正・明細追加ページ
       ========================================================= -->
  <div id="existingPage" class="form-page active">
    <div class="section">
      <div class="section-title">
        <span>🔍 1. 顧客検索（50音・名前）</span>
        <span id="customerCountBadge" style="font-size:12px; color:#666; font-weight:normal;">0名</span>
      </div>

      <label>① 50音行で絞り込み（もう1回タップで解除）</label>
      <div class="row-50on">
        <div class="btn-50on" onclick="filterBy50On('ア', this)">ア行</div>
        <div class="btn-50on" onclick="filterBy50On('カ', this)">カ行</div>
        <div class="btn-50on" onclick="filterBy50On('サ', this)">サ行</div>
        <div class="btn-50on" onclick="filterBy50On('タ', this)">タ行</div>
        <div class="btn-50on" onclick="filterBy50On('ナ', this)">ナ行</div>
        <div class="btn-50on" onclick="filterBy50On('ハ', this)">ハ行</div>
        <div class="btn-50on" onclick="filterBy50On('マ', this)">マ行</div>
        <div class="btn-50on" onclick="filterBy50On('ヤ', this)">ヤ行</div>
        <div class="btn-50on" onclick="filterBy50On('ラ', this)">ラ行</div>
        <div class="btn-50on" onclick="filterBy50On('ワ', this)">ワ行</div>
      </div>

      <label>② 名前・カナで部分一致検索</label>
      <input type="text" id="searchKeyword" oninput="filterByKeyword()" placeholder="例: 芥川 / アクタガワ / C00395">

      <label>③ 顧客を選択してカルテを開く</label>
      <select id="customerSelect" onchange="loadCustomerInfo()">
        <option value="">▼ タップして顧客を選択</option>
      </select>
      <button class="btn" style="background:#9e9e9e; padding:10px; font-size:13px; margin-top:0;" onclick="resetSearch()">🔄 検索条件をリセット（全表示）</button>
    </div>

    <!-- 顧客選択後に表示されるカルテ詳細・編集フォーム -->
    <div id="existingCustomerForm" style="display: none;">

      <!-- 基本情報エリア -->
      <div class="section">
        <div class="section-title">
          <span>👤 2. 基本情報の閲覧・修正</span>
          <span id="e_id_badge" class="badge-id">ID: -</span>
        </div>
        <input type="hidden" id="e_id">

        <label>氏名</label>
        <input type="text" id="e_name">

        <label>カナ</label>
        <input type="text" id="e_kana">

        <div class="grid-2col">
          <div>
            <label>所属店舗</label>
            <select id="e_store"></select>
          </div>
          <div>
            <label>状態（ステータス）</label>
            <select id="e_status"></select>
          </div>
        </div>

        <div class="grid-2col">
          <div>
            <label>入会年月日</label>
            <input type="date" id="e_indate">
          </div>
          <div>
            <label>退会年月日</label>
            <input type="date" id="e_outdate">
          </div>
        </div>

        <button class="btn btn-success" onclick="submitMasterUpdate()">💾 基本情報のみ上書き保存する</button>
      </div>

      <!-- 明細エリア（現在の明細の修正 ＆ 新規明細の追加） -->
      <div class="section">
        <div class="section-title">
          <span>💰 3. 明細・会費データの閲覧・修正</span>
          <span id="d_detail_badge" style="font-size:11px; color:#666;">最新明細</span>
        </div>
        <input type="hidden" id="d_detail_id">

        <div class="grid-2col">
          <div>
            <label>担当スタッフ</label>
            <select id="d_staff"></select>
          </div>
          <div>
            <label>決済方法</label>
            <select id="d_payment"></select>
          </div>
        </div>

        <div class="grid-2col">
          <div>
            <label>会費分類</label>
            <select id="d_category"></select>
          </div>
          <div>
            <label>コース区分</label>
            <select id="d_course"></select>
          </div>
        </div>

        <div class="grid-2col">
          <div>
            <label>金額1 (税込)</label>
            <input type="number" id="d_amount1" placeholder="0" oninput="calculateTotal('d')">
          </div>
          <div>
            <label>金額2 (税込)</label>
            <input type="number" id="d_amount2" placeholder="0" oninput="calculateTotal('d')">
          </div>
        </div>

        <label>合計金額 (自動計算)</label>
        <input type="number" id="d_total" readonly style="background-color: #fce5cd; font-weight: bold; color: #b45f06;" placeholder="0">

        <label>📅 変更年月日（いつの月分から適用するか）</label>
        <input type="date" id="d_date">

        <!-- ★重要：既存明細の修正と、新規行追加を明確に使い分け可能に -->
        <button class="btn btn-warning" onclick="submitDetailUpdate()">✏️ 現在の明細（金額・変更年月日）を上書き修正する</button>
        <button class="btn btn-primary" onclick="submitSaveAll()">✨ 基本情報＋現在の明細をまとめて上書き保存</button>
        <button class="btn btn-outline" onclick="submitDetailAdd()">➕ 新しい明細行として履歴に追加する</button>
      </div>

      <!-- 過去の明細履歴一覧エリア -->
      <div class="section">
        <div class="section-title">
          <span>📋 4. 登録済み明細履歴一覧</span>
        </div>
        <div id="historyContainer">
          <div class="history-empty">履歴データを読み込みます...</div>
        </div>
      </div>

    </div>
  </div>

  <!-- =========================================================
       【2】新規顧客＆初回明細の作成ページ
       ========================================================= -->
  <div id="newPage" class="form-page">
    <div class="section">
      <div class="section-title">✨ 新規顧客マスター＆初回明細作成</div>

      <label>氏名 (必須)</label>
      <input type="text" id="n_name" placeholder="例: 山田 花子">

      <label>カナ</label>
      <input type="text" id="n_kana" placeholder="例: ヤマダ ハナコ">

      <div class="grid-2col">
        <div>
          <label>所属店舗</label>
          <select id="n_store"></select>
        </div>
        <div>
          <label>状態</label>
          <select id="n_status"></select>
        </div>
      </div>

      <div class="grid-2col">
        <div>
          <label>入会年月日</label>
          <input type="date" id="n_indate">
        </div>
        <div>
          <label>退会年月日</label>
          <input type="date" id="n_outdate">
        </div>
      </div>

      <hr style="border:none; border-top:1px dashed #ccc; margin: 16px 0;">

      <div class="grid-2col">
        <div>
          <label>担当スタッフ</label>
          <select id="n_staff"></select>
        </div>
        <div>
          <label>決済方法</label>
          <select id="n_payment"></select>
        </div>
      </div>

      <div class="grid-2col">
        <div>
          <label>会費分類</label>
          <select id="n_category"></select>
        </div>
        <div>
          <label>コース区分</label>
          <select id="n_course"></select>
        </div>
      </div>

      <div class="grid-2col">
        <div>
          <label>金額1 (税込)</label>
          <input type="number" id="n_amount1" placeholder="金額を入力" oninput="calculateTotal('n')">
        </div>
        <div>
          <label>金額2 (税込)</label>
          <input type="number" id="n_amount2" placeholder="無ければ空欄" oninput="calculateTotal('n')">
        </div>
      </div>

      <label>合計金額 (自動計算)</label>
      <input type="number" id="n_total" readonly style="background-color: #fce5cd; font-weight: bold; color: #b45f06;" placeholder="0">

      <label>📅 変更年月日（初回売上計上日）</label>
      <input type="date" id="n_changedate">

      <button class="btn btn-primary" onclick="submitNewCustomer()">✨ 新規顧客として登録する</button>
    </div>
  </div>
</div>

<div id="toastNotification"></div>

<script>
  // =========================================================================
  // ★ GAS WebアプリのデプロイURL（画面からも変更・保存可能）
  // =========================================================================
  var DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbzdB2hbvUWqFEY55HVjr4h1LOcVhNhQ0Y2Yuv7RcxfaPjF5C5L6iYRZA_NN-NHspA/exec";
  var GAS_URL = localStorage.getItem("MUSEFIT_GAS_URL") || DEFAULT_GAS_URL;
  // =========================================================================

  function toggleUrlConfig() {
    var box = document.getElementById('urlConfigBox');
    document.getElementById('gasUrlInput').value = GAS_URL;
    box.style.display = (box.style.display === 'none') ? 'block' : 'none';
  }

  function saveGasUrl() {
    var val = document.getElementById('gasUrlInput').value.trim();
    if (!val || !val.startsWith("https://script.google.com/")) {
      showToast("⚠️ 正しいGASのWebアプリURL（https://script.google.com/.../exec）を入力してください", true);
      return;
    }
    GAS_URL = val;
    localStorage.setItem("MUSEFIT_GAS_URL", GAS_URL);
    document.getElementById('urlConfigBox').style.display = 'none';
    showToast("✅ GASの接続先URLを更新しました！");
    loadInitialMasterData();
  }

  var allCustomers = [];
  var current50on = "";

  function showToast(message, isError) {
    var toast = document.getElementById('toastNotification');
    toast.innerText = message;
    toast.style.backgroundColor = isError ? '#d9423e' : '#2e7d32';
    toast.style.display = 'block';
    setTimeout(function() {
      toast.style.display = 'none';
    }, 3500);
  }

  function calculateTotal(prefix) {
    var a1 = parseFloat(document.getElementById(prefix + '_amount1').value) || 0;
    var a2 = parseFloat(document.getElementById(prefix + '_amount2').value) || 0;
    document.getElementById(prefix + '_total').value = a1 + a2;
  }

  function switchTab(pageId, tabEl) {
    document.querySelectorAll('.form-page').forEach(function(p) { p.classList.remove('active'); });
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.getElementById(pageId).classList.add('active');
    tabEl.classList.add('active');
  }

  // 初期データ読み込み
  window.onload = function() {
    loadInitialMasterData();
  };

  function loadInitialMasterData(keepSelectionName) {
    if (!GAS_URL || !GAS_URL.startsWith("http")) {
      showLoader("⚠️ エラー：GAS_URL の設定が完了していません。");
      return;
    }

    showLoader("🌸 スプレッドシートから最新データを同期中...");

    fetch(GAS_URL + "?action=getInitialData&_t=" + Date.now())
      .then(function(response) {
        if (!response.ok) throw new Error("HTTPエラー: " + response.status);
        return response.json();
      })
      .then(function(res) {
        hideLoader();
        if (res.success) {
          var sBar = document.getElementById("connectionStatus");
          sBar.innerText = "🟢 スプレッドシートと正常に同期しています (オンライン)";
          sBar.className = "status-bar status-online";

          allCustomers = (res.customers || []).map(function(c) {
            if (typeof c === 'object' && c !== null) {
              return { name: String(c.name || ""), kana: String(c.kana || ""), id: String(c.id || "") };
            }
            return { name: String(c), kana: "", id: "" };
          });

          // カナ（または氏名）の五十音順で正確にソート
          allCustomers.sort(function(a, b) {
            var ka = a.kana || a.name;
            var kb = b.kana || b.name;
            return ka.localeCompare(kb, 'ja');
          });

          applyFilter();

          var stores     = (res.stores && res.stores.length > 0) ? res.stores : ['並木', '横川', 'CHANGE FIT'];
          var statuses   = (res.statuses && res.statuses.length > 0) ? res.statuses : ['入会中', '休会', '退会'];
          var staff      = (res.staff && res.staff.length > 0) ? res.staff : ['上川', '新井', '石井', '黒田'];
          var payments   = (res.payments && res.payments.length > 0) ? res.payments : ['ストアーズ', 'トワライズ', 'PAYSYS', '会費PAY', 'フロント払い'];
          var categories = (res.categories && res.categories.length > 0) ? res.categories : ['月額', 'コース', '回数券', '都度払い'];
          var courses    = (res.courses && res.courses.length > 0) ? res.courses : ['552+4', '554+4', '12回券', '都度払い'];

          populateSelectPair('e_store', 'n_store', stores);
          populateSelectPair('e_status', 'n_status', statuses);
          populateSelectPair('d_staff', 'n_staff', staff);
          populateSelectPair('d_payment', 'n_payment', payments);
          populateSelectPair('d_category', 'n_category', categories);
          populateSelectPair('d_course', 'n_course', courses);

          if (keepSelectionName) {
            var cSelect = document.getElementById('customerSelect');
            cSelect.value = keepSelectionName;
            loadCustomerInfo();
          }
        } else {
          throw new Error(res.message || "データ取得失敗");
        }
      })
      .catch(function(err) {
        hideLoader();
        console.warn("接続エラー:", err);
        var sBar = document.getElementById("connectionStatus");
        sBar.innerText = "🔴 通信エラー: " + err.message;
        sBar.className = "status-bar status-offline";
      });
  }

  function populateSelectPair(id1, id2, items) {
    var el1 = document.getElementById(id1);
    var el2 = document.getElementById(id2);
    var prev1 = el1.value;
    var prev2 = el2.value;
    el1.innerHTML = "";
    el2.innerHTML = "";
    items.forEach(function(item) {
      el1.appendChild(new Option(item, item));
      el2.appendChild(new Option(item, item));
    });
    if (prev1 && items.indexOf(prev1) !== -1) el1.value = prev1;
    if (prev2 && items.indexOf(prev2) !== -1) el2.value = prev2;
  }

  function ensureSelectOption(selectId, val) {
    if (val === undefined || val === null || val === "") return;
    var sel = document.getElementById(selectId);
    var exists = false;
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === String(val)) { exists = true; break; }
    }
    if (!exists) {
      sel.appendChild(new Option(String(val), String(val)));
    }
    sel.value = String(val);
  }

  function updateCustomerSelect(list) {
    var cSelect = document.getElementById('customerSelect');
    var currentVal = cSelect.value;
    cSelect.innerHTML = '<option value="">▼ タップして顧客を選択 (' + list.length + '名)</option>';
    document.getElementById('customerCountBadge').innerText = list.length + "名";

    list.forEach(function(c) {
      var strName = c.name || String(c);
      var label = strName + (c.kana ? " (" + c.kana + ")" : "");
      if (strName) {
        cSelect.appendChild(new Option(label, strName));
      }
    });
    if (currentVal) cSelect.value = currentVal;
  }

  function get50OnReg(char) {
    if (char === 'ア') return /^[ア-オあ-おヴ]/;
    if (char === 'カ') return /^[カ-コガ-ゴか-こが-ご]/;
    if (char === 'サ') return /^[サ-ソザ-ゾさ-そざ-ぞ]/;
    if (char === 'タ') return /^[タ-トダ-ドた-とだ-ど]/;
    if (char === 'ナ') return /^[ナ-ノな-の]/;
    if (char === 'ハ') return /^[ハ-ホバ-ボパ-ポは-ほば-ぼぱ-ぽ]/;
    if (char === 'マ') return /^[マ-モま-も]/;
    if (char === 'ヤ') return /^[ヤ-ヨや-よ]/;
    if (char === 'ラ') return /^[ラ-ロら-ろ]/;
    if (char === 'ワ') return /^[ワヲンわをん]/;
    return /.*/;
  }

  function filterBy50On(char, el) {
    var isActive = el.classList.contains('active');
    document.querySelectorAll('.btn-50on').forEach(function(b) { b.classList.remove('active'); });
    if (isActive) {
      current50on = "";
    } else {
      el.classList.add('active');
      current50on = char;
    }
    applyFilter();
  }

  function filterByKeyword() {
    applyFilter();
  }

  function applyFilter() {
    var keyword = document.getElementById('searchKeyword').value.trim().toLowerCase();
    var filtered = allCustomers.filter(function(c) {
      var nameStr = String(c.name || "").replace(/[\s\u3000]+/g, "");
      var kanaStr = String(c.kana || "").replace(/[\s\u3000]+/g, "");
      var idStr   = String(c.id || "").toLowerCase();

      var matchKeyword = true;
      var match50on = true;

      if (keyword) {
        matchKeyword = nameStr.toLowerCase().includes(keyword) ||
                       kanaStr.toLowerCase().includes(keyword) ||
                       idStr.includes(keyword);
      }
      if (current50on) {
        var reg = get50OnReg(current50on);
        match50on = kanaStr ? reg.test(kanaStr) : reg.test(nameStr);
      }
      return matchKeyword && match50on;
    });
    updateCustomerSelect(filtered);
  }

  function resetSearch() {
    document.getElementById('searchKeyword').value = "";
    document.querySelectorAll('.btn-50on').forEach(function(b) { b.classList.remove('active'); });
    current50on = "";
    applyFilter();
    document.getElementById('existingCustomerForm').style.display = 'none';
  }

  // 顧客データ＋最新明細＋履歴の呼び出し
  function loadCustomerInfo() {
    var name = document.getElementById('customerSelect').value;
    var formSec = document.getElementById('existingCustomerForm');
    if (!name) {
      formSec.style.display = 'none';
      return;
    }

    showLoader("🔍 " + name + " 様のカルテを読み込み中...");
    fetch(GAS_URL + "?action=getCustomerData&name=" + encodeURIComponent(name) + "&_t=" + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(res) {
        hideLoader();
        if (res.success && res.data) {
          var d = res.data;
          document.getElementById('e_id').value = d.id || "";
          document.getElementById('e_id_badge').innerText = "ID: " + (d.id || "-");
          document.getElementById('e_name').value = d.name || "";
          document.getElementById('e_kana').value = d.kana || "";
          ensureSelectOption('e_store', d.store);
          ensureSelectOption('e_status', d.status);
          document.getElementById('e_indate').value = d.inDate || "";
          document.getElementById('e_outdate').value = d.outDate || "";

          // 最新明細データの表示
          document.getElementById('d_detail_id').value = d.detailId || "";
          document.getElementById('d_detail_badge').innerText = d.detailId ? ("明細ID: " + d.detailId) : "最新明細";
          if (d.staff) ensureSelectOption('d_staff', d.staff);
          if (d.payment) ensureSelectOption('d_payment', d.payment);
          if (d.category) ensureSelectOption('d_category', d.category);
          if (d.course) ensureSelectOption('d_course', d.course);

          document.getElementById('d_amount1').value = (d.amount1 !== undefined && d.amount1 !== "") ? d.amount1 : "";
          document.getElementById('d_amount2').value = (d.amount2 !== undefined && d.amount2 !== "") ? d.amount2 : "";
          calculateTotal('d');

          // ★変更年月日も表示（GASがchangeDateを返す場合はそれを表示）
          document.getElementById('d_date').value = d.changeDate || "";

          // 履歴テーブルの描画
          renderHistoryTable(d.history || [], d);

          formSec.style.display = 'block';
        } else {
          showToast("顧客データの取得に失敗しました", true);
        }
      })
      .catch(function(err) {
        hideLoader();
        showToast("通信エラー: " + err.message, true);
      });
  }

  function renderHistoryTable(historyList, currentData) {
    var container = document.getElementById('historyContainer');
    // GAS側がまだhistory配列を返さない場合でも、直近の明細があれば1行表示する
    if ((!historyList || historyList.length === 0) && (currentData.payment || currentData.amount1 !== "")) {
      var amt = (Number(currentData.amount1) || 0) + (Number(currentData.amount2) || 0);
      historyList = [{
        detailId: currentData.detailId || "最新",
        changeDate: currentData.changeDate || "(変更年月日未取得)",
        staff: currentData.staff || "-",
        payment: currentData.payment || "-",
        course: currentData.course || "-",
        total: amt
      }];
    }

    if (!historyList || historyList.length === 0) {
      container.innerHTML = '<div class="history-empty">登録されている明細履歴はありません</div>';
      return;
    }

    var html = '<table class="history-table"><thead><tr><th>変更年月日</th><th>決済</th><th>コース</th><th>合計金額</th></tr></thead><tbody>';
    historyList.forEach(function(h) {
      var totalNum = Number(h.total || 0);
      html += '<tr>' +
        '<td>' + (h.changeDate || '-') + '</td>' +
        '<td>' + (h.payment || '-') + '</td>' +
        '<td>' + (h.course || '-') + '</td>' +
        '<td style="font-weight:bold;">¥' + totalNum.toLocaleString() + '</td>' +
      '</tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  // ① 基本情報のみ上書き保存
  function submitMasterUpdate() {
    var id = document.getElementById('e_id').value;
    var name = document.getElementById('e_name').value.trim();
    if (!id || !name) {
      showToast("⚠️ 顧客データが正しく選択されていません", true);
      return;
    }
    sendPostData({
      action: "updateCustomer",
      id: id,
      name: name,
      kana: document.getElementById('e_kana').value.trim(),
      store: document.getElementById('e_store').value,
      status: document.getElementById('e_status').value,
      inDate: document.getElementById('e_indate').value,
      outDate: document.getElementById('e_outdate').value
    }, "✅ 基本情報を上書き保存しました！", function() {
      loadInitialMasterData(name);

  // ★重要修正：GET（JSON応答確認可能・CORSエラー完全ゼロ）＋ POST(no-cors)の二段構えで100%確実に書き込む通信関数
  function sendPostData(data, successMessage, callback) {
    var sBar = document.getElementById("connectionStatus");
    if (sBar.classList.contains("status-offline")) {
      showToast("⚠️ オフライン状態のため保存できません", true);
      return;
    }

    showLoader("💾 スプレッドシートへ書き込み中...");
    var getUrl = GAS_URL + "?action=" + encodeURIComponent(data.action) + "&payload=" + encodeURIComponent(JSON.stringify(data)) + "&_t=" + Date.now();

    fetch(getUrl)
      .then(function(response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(function(res) {
        if (res && res.success) {
          hideLoader();
          showToast(successMessage || "✅ 保存が完了しました！");
          if (callback) callback();
        } else {
          throw new Error((res && res.message) ? res.message : "FallbackToPost");
        }
      })
      .catch(function() {
        // 万が一GASが旧デプロイのまま等の場合は POST (no-cors) で送信
        fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(data)
        })
          .then(function() {
            setTimeout(function() {
              hideLoader();
              showToast(successMessage || "✅ 保存が完了しました！");
              if (callback) callback();
            }, 1000);
          })
          .catch(function(err) {
            hideLoader();
            showToast("⚠️ 通信エラーが発生しました: " + err.message, true);
          });
      });
  }

  function showLoader(text) {
    var l = document.getElementById('globalLoader');
    l.innerHTML = text;
    l.style.display = 'block';
  }
  function hideLoader() {
    document.getElementById('globalLoader').style.display = 'none';
  }
</script>
